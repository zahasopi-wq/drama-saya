<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 Penjana Drama Saya</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { max-width: 600px; margin: 0 auto; padding: 20px; background: #f0f4f8; }
        h1 { text-align: center; color: #2d3748; margin-bottom: 30px; }
        .box { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }
        label { display: block; font-weight: bold; margin-bottom: 8px; color: #1a202c; }
        textarea { width: 100%; height: 120px; padding: 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; resize: vertical; }
        button { width: 100%; padding: 14px; border: none; border-radius: 8px; font-size: 17px; font-weight: bold; cursor: pointer; transition: opacity 0.2s; }
        button:disabled { opacity: 0.6; cursor: not-allowed; }
        .btn-primary { background: #2563eb; color: white; margin-bottom: 12px; }
        .btn-primary:hover { background: #1d4ed8; }
        .btn-dreamina { background: #10b981; color: white; }
        .btn-dreamina:hover { background: #059669; }
        #hasil { display: none; margin-top: 15px; }
        .loading { color: #2563eb; font-style: italic; margin: 10px 0; }
        .info { font-size: 14px; color: #666; margin-top: 5px; }
        h2 { font-size: 16px; color: #2d3748; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>🎬 Penjana Drama Saya</h1>

    <div class="box">
        <label>✍️ Tulis cerita dalam Bahasa Melayu:</label>
        <textarea id="inputMelayu" placeholder="Contoh: Seorang gadis duduk di tepi tingkap... Angin lembut meniup rambutnya. Dia tersenyum melihat langit biru yang penuh harapan."></textarea>
    </div>

    <div class="box">
        <button class="btn-primary" id="btnProses" onclick="janaTeks()">🔄 Tukar ke Bahasa Inggeris</button>
        <div id="status"></div>
        
        <div id="hasil">
            <h2>🌐 Teks Inggeris untuk Dreamina:</h2>
            <textarea id="outputInggeris" readonly></textarea>
            <p class="info">💡 Klik butang di bawah untuk buka Dreamina, kemudian tampal teks di atas</p>
            <button class="btn-dreamina" onclick="bukaDreamina()">🎬 Buka Dreamina →</button>
        </div>
    </div>

    <script>
        async function janaTeks() {
            const teksMelayu = document.getElementById('inputMelayu').value.trim();
            const btn = document.getElementById('btnProses');
            const status = document.getElementById('status');
            const hasil = document.getElementById('hasil');
            const output = document.getElementById('outputInggeris');

            if (!teksMelayu) {
                alert('Sila tulis cerita dahulu!');
                return;
            }

            btn.disabled = true;
            status.innerHTML = '<p class="loading">⏳ Sedang menterjemah... Sila tunggu sekejap...</p>';
            hasil.style.display = 'none';

            try {
                // Guna MyMemory Translation API — percuma & tak perlu kunci
                const sumber = encodeURIComponent(teksMelayu);
                const res = await fetch(`https://api.mymemory.translated.net/get?q=${sumber}&langpair=ms|en`);
                const data = await res.json();

                if (data.responseStatus === 200 && data.responseData) {
                    const terjemahan = data.responseData.translatedText;
                    output.value = terjemahan;
                    hasil.style.display = 'block';
                    status.innerHTML = '<p style="color: green;">✅ Sedia! Salin teks di bawah ke Dreamina</p>';
                } else {
                    throw new Error('Terjemahan gagal');
                }
            } catch (error) {
                // Kalau API gagal, beri mesej & alternatif
                status.innerHTML = '<p style="color: #d97706;">⚠️ Terjemahan automatik tidak tersedia sekarang. Sila gunakan Google Translate sementara.</p>';
                output.value = '[Salin cerita di atas ke Google Translate → pilih Melayu-Inggeris → tampal hasil di sini]\\n\\n' + teksMelayu;
                hasil.style.display = 'block';
            }

            btn.disabled = false;
        }

        function bukaDreamina() {
            window.open('https://dreamina.capcut.com', '_blank');
        }
    </script>
</body>
</html>
